<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulador educacional de urna eletrônica — Espírito Santo 2026">
  <title>Urna Eletrônica — ES 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">SIMULAÇÃO EDUCACIONAL</div>
        <h1>URNA ELETRÔNICA</h1>
      </div>
      <div class="machine-id" id="machineId">URNA ES-2026</div>
    </header>

    <section class="machine">
      <div class="screen-wrap">
        <div class="screen" id="screen">
          <div class="loading">Carregando dados de candidaturas…</div>
        </div>
      </div>

      <div class="keyboard" aria-label="Teclado da urna">
        <div class="num-grid">
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
          <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
          <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
          <button data-key="0" class="zero">0</button>
        </div>
        <div class="action-row">
          <button class="action blank" id="blankBtn">BRANCO</button>
          <button class="action correct" id="correctBtn">CORRIGE</button>
          <button class="action confirm" id="confirmBtn">CONFIRMA</button>
        </div>
      </div>
    </section>

    <section class="control-panel">
      <div class="status" id="status">Inicializando…</div>
      <div class="controls">
        <button id="newVote">Nova votação</button>
        <button id="exportJson">Exportar votos JSON</button>
        <button id="exportCsv">Exportar votos CSV</button>
        <label class="import-label">Importar JSON<input type="file" id="importFile" accept="application/json"></label>
        <button id="countBtn">Apuração</button>
        <button id="clearBtn" class="danger">Apagar simulação</button>
      </div>
    </section>

    <section class="counting" id="counting" hidden></section>

    <footer>
      Simulador independente. Não é uma urna oficial nem substitui sistemas da Justiça Eleitoral.
    </footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
